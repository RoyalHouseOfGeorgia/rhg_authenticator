<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP: connect-src must match PRODUCTION_HOSTNAME in src/verify-page.ts -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://verify.royalhouseofgeorgia.ge; base-uri 'none'; form-action 'none'">
  <!--
    The following response headers are enforced at the Cloudflare edge via the
    "verify-security-headers" Transform Rule on the royalhouseofgeorgia.ge zone:
      Strict-Transport-Security: max-age=31536000; includeSubDomains
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff
      Content-Security-Policy: frame-ancestors 'none'
      Referrer-Policy: no-referrer
    The response-header CSP combines intersectively with the meta CSP above.
    Verify with: curl -sI https://verify.royalhouseofgeorgia.ge/
  -->
  <meta name="referrer" content="no-referrer">
  <title>Royal House of Georgia — Credential Verification</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" href="favicon.ico" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="royal-arms-120.png" alt="Royal Arms of Georgia" class="header-crest" width="120" height="120">
    <h1 class="header-georgian" lang="ka">საქართველოს სამეფო სახლი</h1>
    <p class="header-english">Royal House of Georgia</p>
    <p class="subtitle">Digital Credential Verification</p>
  </header>
  <main id="result" aria-live="polite">
    <!-- Populated by JS -->
    <div class="loading" role="status">Verifying credential…</div>
  </main>
  <noscript>
    <div class="error-banner">
      <p>JavaScript is required to verify credentials.</p>
    </div>
  </noscript>
  <footer>
    <p>&copy; 2026 <a href="https://royalhouseofgeorgia.ge">Royal House of Georgia</a></p>
  </footer>
  <script src="verify.js" integrity="sha384-FnL228fHPccmu8E+B6+j9zhz8JajoWkK0ZJXA5ckpVg2yDeFx+cav0ouSOWt+VqW" crossorigin="anonymous"></script>
</body>
</html>
