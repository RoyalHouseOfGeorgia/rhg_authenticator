name: govulncheck (weekly)

# build.yml runs govulncheck only when code changes, so a Go or dependency
# advisory published between releases would otherwise surface only when the
# next release is being cut. GitHub emails a scheduled run's failure to the
# person who last changed the `schedule` below. Fix with a go.mod bump
# (Go version and/or module), then cut a patch release.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.suffix }})
    # Results depend on GOOS (darwin-only updater, Windows-only code), so scan
    # on the same runners as the release builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            suffix: darwin-arm64
          - os: windows-latest
            suffix: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # go-version-file installs exactly the Go version releases are built
      # with, so standard-library advisories are checked against what ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: govulncheck
        working-directory: go
        run: go tool govulncheck ./...
