name: Python Tools

# Python-only changes skip build.yml (see its paths-ignore), so this workflow
# carries the checks those changes still need: tests and secret scanning.
# CodeQL for Python lives in codeql-python.yml, which runs on every PR.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'go/testdata/vectors.json'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'go/testdata/vectors.json'
      - '.github/workflows/python.yml'

concurrency:
  group: python-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Runner's system python3; the script and tests are stdlib-only.
      - run: python3 -m unittest discover -s scripts -v

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required by gitleaks-action for API access
