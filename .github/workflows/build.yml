name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']  # paths-ignore does not apply to tag pushes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/**'

# Deduplicate: when a tag push and branch push fire simultaneously,
# each event type gets its own group so a release run is never cancelled
# by a concurrent branch run.
concurrency:
  group: build-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'
  NODE_VERSION: '24'

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Check test vectors are in sync
        run: diff go/testdata/vectors.json src/__tests__/fixtures/vectors.json
      - run: npm run lint
      - run: npm test
      - name: Verify verify.js SRI hash
        run: |
          set -euo pipefail
          npm run build:verify
          HASH=$(openssl dgst -sha384 -binary < verify/verify.js | openssl base64 -A)
          grep -q "sha384-$HASH" verify/index.html || (echo "SRI hash mismatch — rebuild verify.js and update index.html" && exit 1)
      - run: npm audit --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        with:
          languages: go, javascript
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libgl1-mesa-dev xorg-dev
      - uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required by gitleaks-action for API access

  # Race detection on macOS only. Windows excluded: -race requires
  # CGO_ENABLED=1 and a C compiler not available on windows-latest runners.
  test-race:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Toolchain versions
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Check gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'gofmt -w .' in go/):"
            echo "$unformatted"
            exit 1
          fi
      - working-directory: go
        run: go test -race ./... -count=1

  build:
    # Explicit name → stable check contexts "build (darwin-arm64)" /
    # "build (windows-amd64)" that don't change when a runner label is bumped
    # (e.g. macos-latest→macos-26). The ruleset's required checks match these.
    name: build (${{ matrix.suffix }})
    needs: [test-typescript, test-race]
    # Fail fast if a GitHub-hosted runner stalls at startup (seen on the macos-26
    # pool) instead of inheriting the default 6-hour job timeout. A green build
    # here completes in well under 30 min.
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-26
            suffix: darwin-arm64
          - os: windows-latest
            suffix: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Toolchain versions (macOS)
        if: runner.os == 'macOS'
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Toolchain versions (Windows)
        if: runner.os == 'Windows'
        run: go version
      - working-directory: go
        run: go mod verify
      - working-directory: go
        run: go vet ./...
      - name: Go tests
        if: runner.os == 'Windows'
        working-directory: go
        run: go test ./... -count=1
      - name: govulncheck
        working-directory: go
        run: go tool govulncheck ./...
      - if: runner.os == 'Windows'
        working-directory: go
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/royalhouseofgeorgia/rhg-authenticator/buildinfo.Version=$env:GITHUB_REF_NAME" -o ../release/rhg-authenticator-${{ matrix.suffix }}.exe .
      - if: runner.os != 'Windows'
        working-directory: go
        run: go build -trimpath -ldflags "-s -w -X github.com/royalhouseofgeorgia/rhg-authenticator/buildinfo.Version=$GITHUB_REF_NAME" -o ../release/rhg-authenticator-${{ matrix.suffix }} .
      - name: Verify version embedding
        if: runner.os != 'Windows'
        run: |
          VERSION=$(release/rhg-authenticator-${{ matrix.suffix }} --version)
          echo "Binary reports version: $VERSION"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] || (echo "Version mismatch: expected '$GITHUB_REF_NAME', got '$VERSION'" && exit 1)
      - name: Verify version embedding
        if: runner.os == 'Windows'
        run: |
          Start-Process -FilePath "release/rhg-authenticator-${{ matrix.suffix }}.exe" -ArgumentList "--version" -Wait -RedirectStandardOutput "version.txt" -RedirectStandardError "version_err.txt" -WindowStyle Hidden
          if (Test-Path "version_err.txt") { $stderr = Get-Content "version_err.txt" -Raw; if ($stderr) { Write-Host "stderr: $stderr" } }
          $VERSION = (Get-Content "version.txt" -Raw).Trim()
          Write-Host "Binary reports version: $VERSION"
          if ($VERSION -ne $env:GITHUB_REF_NAME) { Write-Error "Version mismatch: expected '$env:GITHUB_REF_NAME', got '$VERSION'"; exit 1 }
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rhg-authenticator-${{ matrix.suffix }}
          path: release/rhg-authenticator-${{ matrix.suffix }}*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, security, gitleaks]
    runs-on: ubuntu-latest
    # id-token and attestations needed only by attest-build-provenance step,
    # but GitHub Actions requires job-level permissions. All actions are SHA-pinned;
    # a compromised action would require a commit-SHA collision to execute.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: release
          merge-multiple: true
      # SHA256SUMS for convenience; SLSA provenance attestation below provides
      # stronger integrity verification than GPG-signed checksums.
      - run: cd release && sha256sum rhg-authenticator-* > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
