name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']  # paths-ignore does not apply to tag pushes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/**'
      - 'scripts/*.py'  # Python tools: covered by python.yml
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/revocations.json'  # registry.json PRs run CI (committed-registry test)
      - 'scripts/*.py'  # Python tools: covered by python.yml
      - '.github/workflows/python.yml'

# Deduplicate per ref: a branch, a tag and a PR merge ref each get their own
# group, so a release (tag) run is never cancelled by a concurrent branch run
# of the same commit. Keying on event_name instead would put branch and tag
# pushes (both "push") in one group and let them cancel each other.
concurrency:
  group: build-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # The packages with rhgfake-tagged files; every -tags rhgfake vet/test uses it.
  RHGFAKE_PKGS: ./buildinfo/... ./service/... ./host/... ./cmd/...

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Check test vectors are in sync
        run: diff go/testdata/vectors.json src/__tests__/fixtures/vectors.json
      - run: npm run lint
      - run: npm test
      # scripts/update-sri.sh --check: single source of truth for the hash, shared
      # with the pre-commit hook. Prints the exact command to fix a mismatch.
      - name: Verify verify.js SRI hash
        run: npm run check:sri
      # check:sri rebuilds verify.js; fail if the committed bundle differs from that build,
      # since deploy-pages publishes verify/ exactly as committed.
      - name: Committed verify bundle matches fresh build
        run: git diff --exit-code -- verify/verify.js verify/index.html
      - run: npm audit --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: go, javascript
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required by gitleaks-action for API access

  # Race detection on macOS only. build-windows also compiles cgo (the
  # c-shared rhgcore) with the runner's preinstalled MinGW gcc; -race is not
  # run there.
  test-race:
    runs-on: macos-26
    # Both build jobs wait on this one: a stalled runner must not hold the
    # required checks for the default 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Toolchain versions
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Check gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'gofmt -w .' in go/):"
            echo "$unformatted"
            exit 1
          fi
      - working-directory: go
        run: go test -race ./... -count=1
      # The PIN-cancel, shutdown-during-PIN and busy-during-bulk flows need the
      # software card, so their tests exist only in the rhgfake build.
      - name: Go race tests (rhgfake)
        working-directory: go
        run: |
          # shellcheck disable=SC2086 # RHGFAKE_PKGS is a package list, split on purpose
          go test -race -tags rhgfake $RHGFAKE_PKGS -count=1

  # The native macOS app (SwiftUI over the rhgcore C library): the Go module
  # checked, the library built and smoke-tested, the Swift package tested
  # against its rhgfake variant, then the app bundle built against the
  # release variant, ad-hoc signed and zipped, and uploaded as
  # unsigned-darwin-arm64 (a name kept outside the release pattern; see
  # release) for sign-macos and sign-macos-dryrun.
  # Swift comes from the Xcode pinned below (printed in Toolchain versions).
  build-macos:
    # Explicit names → stable check contexts "build (darwin-arm64)" /
    # "build (windows-amd64)" that don't change when a runner label is bumped
    # (e.g. macos-latest→macos-26). The ruleset's required checks match these.
    name: build (darwin-arm64)
    needs: [test-typescript, test-race]
    runs-on: macos-26
    # Fail fast if a GitHub-hosted runner stalls at startup (seen on the macos-26
    # pool) instead of inheriting the default 6-hour job timeout. A green build
    # here completes in well under 30 min.
    timeout-minutes: 30
    steps:
      # Release versions are always vX.Y.Z (the app's update check ignores
      # anything else), so a misnamed tag fails here instead of publishing.
      - name: Release tag is vX.Y.Z
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' must be vX.Y.Z (e.g. v1.5.0)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Pinned so a runner image's default-Xcode change cannot change the
      # Swift compiler or SDK under us; bump deliberately.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain versions
        run: |
          uname -a
          sw_vers
          go version
          cc --version
          swift --version
          xcodebuild -version
      - name: go mod verify
        working-directory: go
        run: go mod verify
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: go vet (rhgfake)
        working-directory: go
        run: |
          # shellcheck disable=SC2086 # RHGFAKE_PKGS is a package list, split on purpose
          go vet -tags rhgfake $RHGFAKE_PKGS  # the packages the tag changes
      - name: govulncheck
        working-directory: go
        run: go tool govulncheck ./...
      - name: Build both library variants and run the C smoke test
        run: RHGCORE_VERSION="$GITHUB_REF_NAME" bash scripts/rhgcore-smoke.sh
      - name: Swift tests (rhgfake library)
        run: |
          RHGCORE_LIB_DIR="$GITHUB_WORKSPACE/go/release/rhgcore/rhgfake" \
            swift test --package-path macos --scratch-path macos/.build/lib-rhgfake
      # The script runs the built app's --version and fails on an rhgfake
      # build or, for a tag, on a version other than the tag.
      - name: Build the app (release library)
        run: |
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          RHGCORE_LIB_DIR="$GITHUB_WORKSPACE/go/release/rhgcore/release" bash scripts/build-macos-app.sh "$VERSION"
      # Zipped, the bundle keeps the exec bit that artifact upload would drop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-darwin-arm64
          path: release/macos-app/rhg-authenticator-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # The native Windows app (WPF over the rhgcore DLL): the Go module checked
  # and tested on Windows, the library built and smoke-tested, the .NET
  # bridge and view models tested against the rhgfake DLL, then the app
  # published as one self-contained exe embedding the release DLL. The exe is
  # uploaded as rhg-authenticator-windows-amd64, which the release job
  # publishes on tags as built (no Authenticode signing).
  # The .NET SDK comes from windows/global.json (printed in Toolchain versions).
  build-windows:
    name: build (windows-amd64)
    needs: [test-typescript, test-race]
    runs-on: windows-latest
    # Name and timeout: see build-macos.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # Git Bash; the smoke script needs bash and the runner's MinGW gcc
    steps:
      # Release versions are always vX.Y.Z (the app's update check ignores
      # anything else), so a misnamed tag fails here instead of publishing.
      - name: Release tag is vX.Y.Z
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' must be vX.Y.Z (e.g. v1.5.0)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Toolchain versions
        run: |
          uname -a
          go version
          cc --version
          dotnet --info
      - name: go mod verify
        working-directory: go
        run: go mod verify
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: go vet (rhgfake)
        working-directory: go
        run: |
          # shellcheck disable=SC2086 # RHGFAKE_PKGS is a package list, split on purpose
          go vet -tags rhgfake $RHGFAKE_PKGS  # the packages the tag changes
      - name: Go tests
        working-directory: go
        run: go test ./... -count=1
      - name: Go tests (rhgfake)
        working-directory: go
        run: |
          # shellcheck disable=SC2086 # RHGFAKE_PKGS is a package list, split on purpose
          go test -tags rhgfake -count=1 $RHGFAKE_PKGS
      - name: govulncheck
        working-directory: go
        run: go tool govulncheck ./...
      # Go links every .syso in a package into what it builds, the c-shared
      # rhgcore DLL included: never commit one.
      - name: No committed .syso files
        run: |
          files=$(git ls-files '*.syso')
          if [ -n "$files" ]; then echo "::error::committed .syso files are not allowed: $files"; exit 1; fi
      - name: Build both library variants and run the C smoke test
        run: RHGCORE_VERSION="$GITHUB_REF_NAME" bash scripts/rhgcore-smoke.sh
      # No RHGCORE_LIB_DIR: the defaults are under test too (tests/ take the
      # rhgfake library, the app the release one). Normal verbosity lists each
      # test's result, so the Windows-only guard tests can be seen to run.
      - name: .NET tests (rhgfake library)
        run: dotnet test windows/RhgAuthenticator.sln --logger "console;verbosity=normal"
      # The script runs the built app's --version and fails on an rhgfake
      # build or, for a tag, on a version other than the tag.
      - name: Build the app (release library)
        timeout-minutes: 10
        run: |
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          pwsh -NoProfile -File scripts/build-windows-app.ps1 -Version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rhg-authenticator-windows-amd64
          path: release/windows-app/rhg-authenticator-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  # Re-sign the Mac app with the pinned release certificate. Tag-only; the
  # `release` environment (deployment restricted to v* tags) holds the p12.
  # Nothing from the build runs here: no p12 in the build jobs (tests,
  # govulncheck) and no build binary in this one.
  sign-macos:
    if: github.ref_type == 'tag'
    # Sign only once every release gate has passed, so no signed bundle exists
    # for a tag run that will not publish.
    needs: [build-macos, build-windows, security, gitleaks]
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # build-macos's ad-hoc zip (its name is outside the release pattern).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-darwin-arm64
          path: in
      # The runner holds a job's secrets for the whole job, so nothing from the
      # build (its binary, its Go dependencies) ever runs in this job; the
      # signed zip is verified in verify-macos on a fresh runner.
      - name: Sign app bundle
        env:
          P12_B64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PW: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: bash scripts/sign-macos.sh in/rhg-authenticator-darwin-arm64.zip out/rhg-authenticator-darwin-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rhg-authenticator-darwin-arm64
          path: out/rhg-authenticator-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # Runs the app's real install-verification path (scanZip, extract,
  # codesign -R PinnedRequirement, sealed version, executable main binary)
  # against the exact zip that will be published. Separate job with no
  # environment: the build's binary must never run where the key was loaded.
  verify-macos:
    if: github.ref_type == 'tag'
    needs: sign-macos
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: rhg-authenticator-darwin-arm64
          path: out
      - name: Verify signed zip with the app's update check
        run: bash scripts/verify-macos.sh out/rhg-authenticator-darwin-arm64.zip "$GITHUB_REF_NAME"
      # Installed old releases' own update checks, each against its real
      # pinned certificate: the path an installed app takes to this release.
      - name: Verify old releases' updaters accept the signed zip
        run: bash scripts/verify-macos-compat.sh out/rhg-authenticator-darwin-arm64.zip "$GITHUB_REF_NAME"

  # Same signing + verification path as sign-macos, with a throwaway cert, on
  # every non-tag build so a broken script surfaces before a release tag. It
  # signs and verifies build-macos's zip and checks that the v1.5.x updaters
  # accept it. No environment, no repository signing material. It does not
  # wait for build-windows.
  # Required on main (ruleset): it is skipped on tags, which counts as passing.
  sign-macos-dryrun:
    if: github.ref_type != 'tag'
    needs: build-macos
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-darwin-arm64  # ad-hoc build, Info.plist version 0.0.0
          path: in
      # /usr/bin/openssl is LibreSSL; the cert recipe needs OpenSSL 3.
      - name: Sign with a throwaway certificate
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_PREFIX=$(brew --prefix --installed openssl@3)
          bash scripts/gen-macos-cert.sh "$OPENSSL_PREFIX/bin/openssl" gen/
          P12_B64=$(cat gen/cert.p12.b64)
          P12_PW=$(cat gen/password.txt)
          export P12_B64 P12_PW
          bash scripts/sign-macos.sh in/rhg-authenticator-darwin-arm64.zip out/rhg-authenticator-darwin-arm64.zip
      - name: Verify signed zip with the app's update check
        run: bash scripts/verify-macos.sh out/rhg-authenticator-darwin-arm64.zip v0.0.0 "$(cat gen/requirement.txt)"
      # Installed old releases' own update checks, against the same zip.
      - name: Verify old releases' updaters accept the signed zip
        run: bash scripts/verify-macos-compat.sh out/rhg-authenticator-darwin-arm64.zip v0.0.0 "$(cat gen/requirement.txt)"
      # Under the name sign-macos uses, so release-dryrun can assemble this
      # run's assets exactly as a tag's release job would.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rhg-authenticator-darwin-arm64
          path: out/rhg-authenticator-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 1

  # The release job's assembly (artifact names, download pattern, asset
  # check, checksums) on every non-tag build, so a mismatch surfaces before
  # a release tag. Publishes nothing.
  release-dryrun:
    if: github.ref_type != 'tag'
    needs: [sign-macos-dryrun, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: rhg-authenticator-*
          path: release
          merge-multiple: true
      - name: Release assets are exactly the Mac zip and the Windows exe
        run: bash scripts/check-release-assets.sh release
      - name: SHA256SUMS
        run: cd release && sha256sum rhg-authenticator-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-macos, sign-macos, build-macos, build-windows, security, gitleaks]
    runs-on: ubuntu-latest
    # id-token and attestations needed only by attest-build-provenance step,
    # but GitHub Actions requires job-level permissions. All actions are SHA-pinned;
    # a compromised action would require a commit-SHA collision to execute.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # Only sign-macos's signed zip and build-windows's exe carry
          # rhg-authenticator-* names: build-macos uploads its ad-hoc zip as
          # unsigned-darwin-arm64 so it can never be published, and
          # sign-macos-dryrun's upload exists only in non-tag runs.
          # release-dryrun runs this same assembly on every push.
          pattern: rhg-authenticator-*
          path: release
          merge-multiple: true
      # Publish exactly the two app files, both non-empty: a missing, empty or
      # unexpected file fails here, before anything is checksummed, attested
      # or released.
      - name: Release assets are exactly the Mac zip and the Windows exe
        run: bash scripts/check-release-assets.sh release
      # SHA256SUMS for convenience; SLSA provenance attestation below provides
      # stronger integrity verification than GPG-signed checksums.
      - name: SHA256SUMS
        run: cd release && sha256sum rhg-authenticator-* > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: release/*
          body: |
            **Mac:** download `rhg-authenticator-darwin-arm64.zip`. **Windows:** download the `.exe`.
            Install steps: https://github.com/RoyalHouseOfGeorgia/rhg_authenticator#download--install
            Requires macOS 14 or later (Apple silicon), or Windows 10/11 (x64).
            Upgrading from v1.x: an installed Mac app updates itself; if it doesn't, download the zip below.
          generate_release_notes: true
