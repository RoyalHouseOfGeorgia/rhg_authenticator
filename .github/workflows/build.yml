name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']  # paths-ignore does not apply to tag pushes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/**'
      - 'scripts/*.py'  # Python tools: covered by python.yml
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/revocations.json'  # registry.json PRs run CI (committed-registry test)
      - 'scripts/*.py'  # Python tools: covered by python.yml
      - '.github/workflows/python.yml'

# Deduplicate per ref: a branch, a tag and a PR merge ref each get their own
# group, so a release (tag) run is never cancelled by a concurrent branch run
# of the same commit. Keying on event_name instead would put branch and tag
# pushes (both "push") in one group and let them cancel each other.
concurrency:
  group: build-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # The packages with rhgfake-tagged files; every -tags rhgfake vet/test uses it.
  RHGFAKE_PKGS: ./buildinfo/... ./service/... ./host/... ./cmd/...

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Check test vectors are in sync
        run: diff go/testdata/vectors.json src/__tests__/fixtures/vectors.json
      - run: npm run lint
      - run: npm test
      # scripts/update-sri.sh --check: single source of truth for the hash, shared
      # with the pre-commit hook. Prints the exact command to fix a mismatch.
      - name: Verify verify.js SRI hash
        run: npm run check:sri
      # check:sri rebuilds verify.js; fail if the committed bundle differs from that build,
      # since deploy-pages publishes verify/ exactly as committed.
      - name: Committed verify bundle matches fresh build
        run: git diff --exit-code -- verify/verify.js verify/index.html
      - run: npm audit --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: go, javascript
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libgl1-mesa-dev xorg-dev
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required by gitleaks-action for API access

  # Race detection on macOS only. The Windows build job also compiles cgo
  # (Fyne/GLFW) with the runner's preinstalled MinGW gcc; -race is not run there.
  test-race:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Toolchain versions
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Check gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'gofmt -w .' in go/):"
            echo "$unformatted"
            exit 1
          fi
      - working-directory: go
        run: go test -race ./... -count=1
      # The PIN-cancel, shutdown-during-PIN and busy-during-bulk flows need the
      # software card, so their tests exist only in the rhgfake build.
      - working-directory: go
        run: go test -race -tags rhgfake $RHGFAKE_PKGS -count=1

  # The native Windows app (WPF over the rhgcore DLL): the library built and
  # smoke-tested, the Go rhgfake tests run on Windows, the .NET bridge and
  # view models tested against the rhgfake DLL, then the app published as one
  # self-contained exe embedding the release DLL. Not yet a required check;
  # its exe is a 7-day workflow artifact only; the release path is wired to
  # it at the native cutover.
  # The .NET SDK comes from windows/global.json (printed in Toolchain versions).
  windows-app:
    name: windows-app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # Git Bash; the smoke script needs bash and the runner's MinGW gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Toolchain versions
        run: |
          uname -a
          go version
          cc --version
          dotnet --info
      - working-directory: go
        run: go vet -tags rhgfake $RHGFAKE_PKGS  # the packages the tag changes; build vets the rest
      - working-directory: go
        run: go test -tags rhgfake -count=1 $RHGFAKE_PKGS
      - name: Build both library variants and run the C smoke test
        run: RHGCORE_VERSION="$GITHUB_REF_NAME" bash scripts/rhgcore-smoke.sh
      # No RHGCORE_LIB_DIR: the defaults are under test too (tests/ take the
      # rhgfake library, the app the release one).
      - name: .NET tests (rhgfake library)
        run: dotnet test windows/RhgAuthenticator.sln
      - name: Build the app (release library)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          ./scripts/build-windows-app.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-app
          path: release/windows-app/rhg-authenticator-windows-amd64.exe
          retention-days: 7

  # The native macOS app (SwiftUI over the rhgcore C library): the library
  # built and smoke-tested, the Swift package tested against its rhgfake
  # variant, then the app bundle built against the release variant, ad-hoc
  # signed and zipped. Its zip is a 7-day workflow artifact that
  # sign-macos-dryrun signs and verifies; the release path is wired to it at
  # the native cutover.
  # Swift comes from the Xcode pinned below (printed in Toolchain versions).
  macos-app:
    name: macos-app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Pinned so a runner image's default-Xcode change cannot change the
      # Swift compiler or SDK under us; bump deliberately.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain versions
        run: |
          uname -a
          go version
          cc --version
          swift --version
          xcodebuild -version
      - working-directory: go
        run: go vet -tags rhgfake $RHGFAKE_PKGS  # the packages the tag changes; build vets the rest
      - name: Build both library variants and run the C smoke test
        run: RHGCORE_VERSION="$GITHUB_REF_NAME" bash scripts/rhgcore-smoke.sh
      - name: Swift tests (rhgfake library)
        run: |
          RHGCORE_LIB_DIR="$GITHUB_WORKSPACE/go/release/rhgcore/rhgfake" \
            swift test --package-path macos --scratch-path macos/.build/lib-rhgfake
      - name: Build the app (release library)
        run: |
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          RHGCORE_LIB_DIR="$GITHUB_WORKSPACE/go/release/rhgcore/release" bash scripts/build-macos-app.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-app
          path: release/macos-app/rhg-authenticator-darwin-arm64.zip
          retention-days: 7

  build:
    # Explicit name → stable check contexts "build (darwin-arm64)" /
    # "build (windows-amd64)" that don't change when a runner label is bumped
    # (e.g. macos-latest→macos-26). The ruleset's required checks match these.
    name: build (${{ matrix.suffix }})
    needs: [test-typescript, test-race]
    # Fail fast if a GitHub-hosted runner stalls at startup (seen on the macos-26
    # pool) instead of inheriting the default 6-hour job timeout. A green build
    # here completes in well under 30 min.
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-26
            suffix: darwin-arm64
          - os: windows-latest
            suffix: windows-amd64
    runs-on: ${{ matrix.os }}
    # Checks the Go module (vet, Windows tests, govulncheck); it builds no app.
    # The native apps come from windows-app / macos-app, and the release path
    # is wired to them at the native cutover. Until then a tag fails here, so
    # sign-macos, verify-macos and release (which need build) never run.
    steps:
      # Release versions are always vX.Y.Z (the app's update check ignores
      # anything else), so a misnamed tag fails here instead of publishing.
      - name: Release tag is vX.Y.Z
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' must be vX.Y.Z (e.g. v1.5.0)"; exit 1
          fi
      - name: No release before the native cutover
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          echo "::error::this workflow builds no release app yet (the Fyne build is removed; the native release path arrives with the cutover)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Toolchain versions (macOS)
        if: runner.os == 'macOS'
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Toolchain versions (Windows)
        if: runner.os == 'Windows'
        run: go version
      - working-directory: go
        run: go mod verify
      - working-directory: go
        run: go vet ./...
      - name: Go tests
        if: runner.os == 'Windows'
        working-directory: go
        run: go test ./... -count=1
      - name: govulncheck
        working-directory: go
        run: go tool govulncheck ./...
      # Go links every .syso in the package into the binary: never commit one.
      - name: No committed .syso files
        shell: bash
        run: |
          files=$(git ls-files '*.syso')
          if [ -n "$files" ]; then echo "::error::committed .syso files are not allowed: $files"; exit 1; fi

  # Re-sign the Mac app with the pinned release certificate. Tag-only; the
  # `release` environment (deployment restricted to v* tags) holds the p12.
  # Nothing from the build runs here: no p12 in the build job (tests,
  # govulncheck) and no build binary in this one.
  sign-macos:
    if: github.ref_type == 'tag'
    # Sign only once every release gate has passed, so no signed bundle exists
    # for a tag run that will not publish.
    needs: [build, security, gitleaks]
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # No job uploads this artifact until the native cutover (build no
      # longer builds an app); build fails tag runs before this job starts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-darwin-arm64
          path: in
      # The runner holds a job's secrets for the whole job, so nothing from the
      # build (its binary, its Go dependencies) ever runs in this job; the
      # signed zip is verified in verify-macos on a fresh runner.
      - name: Sign app bundle
        env:
          P12_B64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PW: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: bash scripts/sign-macos.sh in/rhg-authenticator-darwin-arm64.zip out/rhg-authenticator-darwin-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rhg-authenticator-darwin-arm64
          path: out/rhg-authenticator-darwin-arm64.zip
          retention-days: 7

  # Runs the app's real install-verification path (scanZip, extract,
  # codesign -R PinnedRequirement, sealed version, executable main binary)
  # against the exact zip that will be published. Separate job with no
  # environment: the build's binary must never run where the key was loaded.
  verify-macos:
    if: github.ref_type == 'tag'
    needs: sign-macos
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: rhg-authenticator-darwin-arm64
          path: out
      - name: Verify signed zip with the app's update check
        run: bash scripts/verify-macos.sh out/rhg-authenticator-darwin-arm64.zip "$GITHUB_REF_NAME"

  # Same signing + verification path as sign-macos, with a throwaway cert, on
  # every non-tag build so a broken script surfaces before a release tag. It
  # signs and verifies the native app's zip (macos-app) and checks that the
  # v1.5.x updaters accept it. No environment, no repository signing material.
  # Required on main (ruleset): it is skipped on tags, which counts as passing.
  sign-macos-dryrun:
    if: github.ref_type != 'tag'
    needs: macos-app
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: macos-app  # native app, ad-hoc build, Info.plist version 0.0.0
          path: in
      # /usr/bin/openssl is LibreSSL; the cert recipe needs OpenSSL 3.
      - name: Sign with a throwaway certificate
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_PREFIX=$(brew --prefix --installed openssl@3)
          bash scripts/gen-macos-cert.sh "$OPENSSL_PREFIX/bin/openssl" gen/
          P12_B64=$(cat gen/cert.p12.b64)
          P12_PW=$(cat gen/password.txt)
          export P12_B64 P12_PW
          bash scripts/sign-macos.sh in/rhg-authenticator-darwin-arm64.zip out/rhg-authenticator-darwin-arm64.zip
      - name: Verify signed zip with the app's update check
        run: bash scripts/verify-macos.sh out/rhg-authenticator-darwin-arm64.zip v0.0.0 "$(cat gen/requirement.txt)"
      # Installed old releases' own update checks, against the same zip.
      - name: Verify old releases' updaters accept the signed zip
        run: bash scripts/verify-macos-compat.sh out/rhg-authenticator-darwin-arm64.zip v0.0.0 "$(cat gen/requirement.txt)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-macos, sign-macos, build, security, gitleaks]
    runs-on: ubuntu-latest
    # id-token and attestations needed only by attest-build-provenance step,
    # but GitHub Actions requires job-level permissions. All actions are SHA-pinned;
    # a compromised action would require a commit-SHA collision to execute.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # Nothing reaches this job until the native cutover: build fails tag
          # runs, so sign-macos never uploads the signed zip and no job
          # uploads a Windows exe.
          pattern: rhg-authenticator-*  # sign-macos's signed zip plus, from the native cutover, the Windows exe
          path: release
          merge-multiple: true
      # SHA256SUMS for convenience; SLSA provenance attestation below provides
      # stronger integrity verification than GPG-signed checksums.
      - run: cd release && sha256sum rhg-authenticator-* > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: release/*
          body: |
            **Mac:** download `rhg-authenticator-darwin-arm64.zip` (Apple Silicon only). **Windows:** download the `.exe`.
            Install steps: https://github.com/RoyalHouseOfGeorgia/rhg_authenticator#download--install
          generate_release_notes: true
