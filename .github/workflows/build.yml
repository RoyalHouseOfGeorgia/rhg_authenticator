name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']  # paths-ignore does not apply to tag pushes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/**'
      - 'scripts/*.py'  # Python tools: covered by python.yml
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.reqs/**'
      - 'verify/keys/revocations.json'  # registry.json PRs run CI (committed-registry test)
      - 'scripts/*.py'  # Python tools: covered by python.yml
      - '.github/workflows/python.yml'

# Deduplicate: when a tag push and branch push fire simultaneously,
# each event type gets its own group so a release run is never cancelled
# by a concurrent branch run.
concurrency:
  group: build-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Check test vectors are in sync
        run: diff go/testdata/vectors.json src/__tests__/fixtures/vectors.json
      - run: npm run lint
      - run: npm test
      # scripts/update-sri.sh --check: single source of truth for the hash, shared
      # with the pre-commit hook. Prints the exact command to fix a mismatch.
      - name: Verify verify.js SRI hash
        run: npm run check:sri
      # check:sri rebuilds verify.js; fail if the committed bundle differs from that build,
      # since deploy-pages publishes verify/ exactly as committed.
      - name: Committed verify bundle matches fresh build
        run: git diff --exit-code -- verify/verify.js verify/index.html
      - run: npm audit --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: go, javascript
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libgl1-mesa-dev xorg-dev
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required by gitleaks-action for API access

  # Race detection on macOS only. The Windows build job also compiles cgo
  # (Fyne/GLFW) with the runner's preinstalled MinGW gcc; -race is not run there.
  test-race:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Toolchain versions
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Check gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'gofmt -w .' in go/):"
            echo "$unformatted"
            exit 1
          fi
      - working-directory: go
        run: go test -race ./... -count=1

  build:
    # Explicit name → stable check contexts "build (darwin-arm64)" /
    # "build (windows-amd64)" that don't change when a runner label is bumped
    # (e.g. macos-latest→macos-26). The ruleset's required checks match these.
    name: build (${{ matrix.suffix }})
    needs: [test-typescript, test-race]
    # Fail fast if a GitHub-hosted runner stalls at startup (seen on the macos-26
    # pool) instead of inheriting the default 6-hour job timeout. A green build
    # here completes in well under 30 min.
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-26
            suffix: darwin-arm64
          - os: windows-latest
            suffix: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      # Release versions are always vX.Y.Z (the app's update check ignores
      # anything else), so a misnamed tag fails here instead of publishing.
      - name: Release tag is vX.Y.Z
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' must be vX.Y.Z (e.g. v1.5.0)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Toolchain versions (macOS)
        if: runner.os == 'macOS'
        run: uname -m && sw_vers && xcodebuild -version && go version
      - name: Toolchain versions (Windows)
        if: runner.os == 'Windows'
        run: go version
      - working-directory: go
        run: go mod verify
      - working-directory: go
        run: go vet ./...
      - name: Go tests
        if: runner.os == 'Windows'
        working-directory: go
        run: go test ./... -count=1
      - name: govulncheck
        working-directory: go
        run: go tool govulncheck ./...
      # Go links every .syso in the package into the binary; the only one
      # allowed is the icon resource generated below, never a committed blob.
      - name: No committed .syso files
        shell: bash
        run: |
          files=$(git ls-files '*.syso')
          if [ -n "$files" ]; then echo "::error::committed .syso files are not allowed: $files"; exit 1; fi
      # Embed the app icon in the .exe. Runs after the tests so the .syso only
      # affects this build. No manifest: the exe has never had one, so DPI and
      # common-controls behaviour stay unchanged. go run keeps the tool out of
      # go.mod, so its dependencies can't move the app's.
      - name: Embed Windows icon
        if: runner.os == 'Windows'
        working-directory: go
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon icon.png --manifest none
          if (-not (Test-Path rsrc_windows_amd64.syso)) { Write-Error "go-winres did not produce rsrc_windows_amd64.syso"; exit 1 }
        shell: pwsh
      - if: runner.os == 'Windows'
        working-directory: go
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/royalhouseofgeorgia/rhg-authenticator/buildinfo.Version=$env:GITHUB_REF_NAME" -o ../release/rhg-authenticator-${{ matrix.suffix }}.exe .
      - if: runner.os != 'Windows'
        working-directory: go
        run: go build -trimpath -ldflags "-s -w -X github.com/royalhouseofgeorgia/rhg-authenticator/buildinfo.Version=$GITHUB_REF_NAME" -o ../release/rhg-authenticator-${{ matrix.suffix }} .
      - name: Verify version embedding
        if: runner.os != 'Windows'
        run: |
          VERSION=$(release/rhg-authenticator-${{ matrix.suffix }} --version)
          echo "Binary reports version: $VERSION"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] || (echo "Version mismatch: expected '$GITHUB_REF_NAME', got '$VERSION'" && exit 1)
      - name: Verify version embedding
        if: runner.os == 'Windows'
        run: |
          Start-Process -FilePath "release/rhg-authenticator-${{ matrix.suffix }}.exe" -ArgumentList "--version" -Wait -RedirectStandardOutput "version.txt" -RedirectStandardError "version_err.txt" -WindowStyle Hidden
          if (Test-Path "version_err.txt") { $stderr = Get-Content "version_err.txt" -Raw; if ($stderr) { Write-Host "stderr: $stderr" } }
          $VERSION = (Get-Content "version.txt" -Raw).Trim()
          Write-Host "Binary reports version: $VERSION"
          if ($VERSION -ne $env:GITHUB_REF_NAME) { Write-Error "Version mismatch: expected '$env:GITHUB_REF_NAME', got '$VERSION'"; exit 1 }
        shell: pwsh
      # Wrap the binary in a double-clickable .app. The ad-hoc bundle signature is
      # required: without it, Gatekeeper on Apple Silicon reports the downloaded app
      # as "damaged" with no "Open Anyway" option.
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="release/RHG Authenticator.app"
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp release/rhg-authenticator-${{ matrix.suffix }} "$APP/Contents/MacOS/rhg-authenticator"
          cp go/packaging/macos/Info.plist "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          # go/icon.png is a 1024×1024 square with the standard ~10% margin.
          ICONSET="$RUNNER_TEMP/icon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s go/icon.png --out "$ICONSET/icon_${s}x${s}.png"
            sips -z $((s * 2)) $((s * 2)) go/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/icon.icns"
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # No resource forks, xattrs or quarantine: AppleDouble ._* / __MACOSX
          # entries would fail the in-app updater's single-top-level-dir check.
          (cd release && ditto -c -k --norsrc --noextattr --noqtn --keepParent "RHG Authenticator.app" rhg-authenticator-${{ matrix.suffix }}.zip)
          rm -rf "$APP" release/rhg-authenticator-${{ matrix.suffix }}
      # On tags the ad-hoc Mac zip goes to sign-macos under a name outside the
      # release job's rhg-authenticator-* pattern, so only the signed zip is
      # published. Zipped, it keeps the exec bit that artifact upload would drop.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: runner.os != 'macOS' || github.ref_type != 'tag'
        with:
          name: rhg-authenticator-${{ matrix.suffix }}
          path: release/rhg-authenticator-${{ matrix.suffix }}*
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        with:
          name: unsigned-${{ matrix.suffix }}
          path: release/rhg-authenticator-${{ matrix.suffix }}.zip
          retention-days: 7

  # Re-sign the Mac app with the pinned release certificate. Tag-only; the
  # `release` environment (deployment restricted to v* tags) holds the p12.
  # Nothing from the build runs here: no p12 in the build job (tests,
  # govulncheck, `go run` tools) and no build binary in this one.
  sign-macos:
    if: github.ref_type == 'tag'
    # Sign only once every release gate has passed, so no signed bundle exists
    # for a tag run that will not publish.
    needs: [build, security, gitleaks]
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: unsigned-darwin-arm64
          path: in
      # The runner holds a job's secrets for the whole job, so nothing from the
      # build (its binary, its Go dependencies) ever runs in this job; the
      # signed zip is verified in verify-macos on a fresh runner.
      - name: Sign app bundle
        env:
          P12_B64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PW: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: bash scripts/sign-macos.sh in/rhg-authenticator-darwin-arm64.zip out/rhg-authenticator-darwin-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rhg-authenticator-darwin-arm64
          path: out/rhg-authenticator-darwin-arm64.zip
          retention-days: 7

  # Runs the app's real install-verification path (scanZip, extract,
  # codesign -R PinnedRequirement, sealed version, executable main binary)
  # against the exact zip that will be published. Separate job with no
  # environment: the build's binary must never run where the key was loaded.
  verify-macos:
    if: github.ref_type == 'tag'
    needs: sign-macos
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rhg-authenticator-darwin-arm64
          path: out
      - name: Verify signed zip with the app's update check
        run: bash scripts/verify-macos.sh out/rhg-authenticator-darwin-arm64.zip "$GITHUB_REF_NAME"

  # Same signing + verification path as sign-macos, with a throwaway cert, on
  # every non-tag build so a broken script surfaces before a release tag.
  # No environment, no repository signing material. Required on main (ruleset):
  # it is skipped on tags, which counts as passing.
  sign-macos-dryrun:
    if: github.ref_type != 'tag'
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: rhg-authenticator-darwin-arm64  # ad-hoc build, Info.plist version 0.0.0
          path: in
      # /usr/bin/openssl is LibreSSL; the cert recipe needs OpenSSL 3.
      - name: Sign with a throwaway certificate
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_PREFIX=$(brew --prefix --installed openssl@3)
          bash scripts/gen-macos-cert.sh "$OPENSSL_PREFIX/bin/openssl" gen/
          P12_B64=$(cat gen/cert.p12.b64)
          P12_PW=$(cat gen/password.txt)
          export P12_B64 P12_PW
          bash scripts/sign-macos.sh in/rhg-authenticator-darwin-arm64.zip out/rhg-authenticator-darwin-arm64.zip
      - name: Verify signed zip with the app's update check
        run: bash scripts/verify-macos.sh out/rhg-authenticator-darwin-arm64.zip v0.0.0 "$(cat gen/requirement.txt)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-macos, sign-macos, build, security, gitleaks]
    runs-on: ubuntu-latest
    # id-token and attestations needed only by attest-build-provenance step,
    # but GitHub Actions requires job-level permissions. All actions are SHA-pinned;
    # a compromised action would require a commit-SHA collision to execute.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: rhg-authenticator-*  # only the build artifacts, never other jobs' uploads
          path: release
          merge-multiple: true
      # SHA256SUMS for convenience; SLSA provenance attestation below provides
      # stronger integrity verification than GPG-signed checksums.
      - run: cd release && sha256sum rhg-authenticator-* > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: release/*
          body: |
            **Mac:** download `rhg-authenticator-darwin-arm64.zip` (Apple Silicon only). **Windows:** download the `.exe`.
            Install steps: https://github.com/RoyalHouseOfGeorgia/rhg_authenticator#download--install
          generate_release_notes: true
