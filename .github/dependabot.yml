version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-patch-days: 3
    groups:
      actions:
        update-types:
          - minor
          - patch
